const VERSAO_ID = '46f65e2b3b2b';
// confere se há versão mais nova publicada (evita cópia antiga guardada pelo navegador)
async function checaVersao() {
  try {
    const r = await fetch('versao.json?t=' + Date.now(), {cache: 'no-store'});
    if (!r.ok) return false;
    const j = await r.json();
    if (j.id && j.id !== VERSAO_ID) {
      const u = new URL(location.href);
      if (u.searchParams.get('v') === j.id) return false;
      u.searchParams.set('v', j.id); location.replace(u.toString()); return true;
    }
  } catch (_) {}
  return false;
}
const u8 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function abrir(pw, auto) {

    const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: u8(D.i)}, key, u8(D.c));
    try { if (document.getElementById('lembrar').checked || auto) localStorage.setItem('fc_pw', pw); } catch (_) {}

    document.open(); document.write(html); document.close();
  } catch (err) {
    try { localStorage.removeItem('fc_pw'); } catch (_) {}
    b.disabled = false; b.textContent = 'Abrir painel';

  }
}
