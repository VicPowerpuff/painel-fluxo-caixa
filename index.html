async function abrir(pw, auto) {
  const b = document.getElementById('b'), e = document.getElementById('e');
  b.disabled = true; b.textContent = 'Abrindo…'; e.textContent = '';
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: u8(D.s), iterations: D.n, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: u8(D.i)}, key, u8(D.c));
    try { if (document.getElementById('lembrar').checked || auto) localStorage.setItem('fc_pw', pw); } catch (_) {}
    const html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  } catch (err) {
    try { localStorage.removeItem('fc_pw'); } catch (_) {}

  }
